# Author carol.yaml values + author carol.launch values; export/log-only changes.
common:
  lid_topic: /livox/lidar
  imu_topic: /imu/data
  time_sync_en: false
  time_offset_lidar_to_imu: 0.0
preprocess:
  lidar_type: 1
  scan_line: 6
  blind: 0
mapping:
  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 90
  det_range: 450.0
  extrinsic_est_en: false
  extrinsic_T: [0.049258, -0.012500, 0.026946]
  extrinsic_R: [0.999620, 0.027463, 0.002445, -0.027517, 0.999299, 0.025398, -0.001746, -0.025456, 0.999674]
publish:
  path_en: true
  scan_publish_en: true
  dense_publish_en: true
  scan_bodyframe_pub_en: true
pcd_save:
  pcd_save_en: false
  interval: 100
feature_extract_enable: false
point_filter_num: 1
max_iteration: 10
filter_size_surf: 0.3
filter_size_map: 0.3
cube_side_length: 1000
runtime_pos_log_enable: true
