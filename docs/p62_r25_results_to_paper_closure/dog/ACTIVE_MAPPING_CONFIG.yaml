common:
  img_topic: "/image_left/image_rect"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  max_lid_buffer_size: 10
  max_imu_buffer_size: 500
  max_prop_imu_buffer_size: 1500
  ros_driver_bug_fix: false
  subscribe_compressed_fallback: true

extrin_calib:
  # MID360 LiDAR-IMU. Use identity/zero unless a separate LiDAR-IMU calibration is available.
  extrinsic_T: [0.0, 0.0, 0.0]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  # T_camera_lidar: X_camera = Rcl * X_lidar + Pcl
  # Source: /home/jian/rosbag/外参标定/grabed_frames_all/indoor2/2026_07_17_22_26_16_perm8_calib_result.txt
  Rcl: [0.008746632885, -0.9995229208, 0.02962139622,
        0.3925737708, -0.02381193512, -0.9194122178,
        0.9196789281, 0.01967034435, 0.3921782078]
  Pcl: [-0.002275880026, -0.1384637097, -0.05836058027]

time_offset:
  lidar_time_offset: 0.0
  imu_time_offset: 0.0
  img_time_offset: -0.18
  exposure_time_init: 0.0
  td_search_en: false

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox CustomMsg from livox_ros_driver2, topic /livox/lidar
  scan_line: 4
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 1000 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.1

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 2.0 # 0.2
  gyr_cov: 0.1 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.005 # 0.0025
  voxel_size: 2.0
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: true
  gravity_align_en: false

publish:
  dense_map_en: true
  # 彩色地图看 /cloud_registered (surround, RGB8)；勿用 /cloud_effected 当主地图（强度灰/红）
  pub_effect_point_en: true
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  pub_pt_minimum_views: 1
  append_global_map_point_step: 1

evo:
  seq_name: "hik_mid360"
  pose_output_en: true

output:
  # Change these two fields for each dataset.
  root_dir: "/home/jian/rosbag/loop2_map_match_experiment_2026_08_08_17_36_19/outputs"
  dataset_name: "loop2"
  # Leave empty to use: root_dir/dataset_name
  run_dir: ""

bag_record:
  # Leave empty to use: output/run_dir/bag
  save_dir: ""
  # Leave empty to use: output/dataset_name
  prefix: ""

pcd_save:
  pcd_save_en: true
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false
  # Leave empty to use: output/run_dir/pcd
  save_dir: ""
  # Leave empty to use: output/dataset_name
  prefix: ""
  use_timestamp: true
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

colmap_save:
  # Leave empty to use: output/run_dir/colmap
  save_dir: ""

pose_save:
  # Leave empty to use: pcd_save/save_dir
  save_dir: ""

log_save:
  # Leave empty to use: output/run_dir/logs
  save_dir: ""

image_save:
  img_save_en: false
  interval: 1
