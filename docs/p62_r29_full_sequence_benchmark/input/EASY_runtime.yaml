frames:
  map_frame: benchmark_map
  base_frame: benchmark_lidar
topics:
  imu: /newer_college/imu
  lidar: /newer_college/deskewed_points
  lidar_msg_type: pointcloud2
  odom_high_rate: /dog_livo/odom_high_rate
  imu_propagate: /LIVO2/imu_propagate
  odom_corrected: /dog_livo/odom_corrected
  path_high_rate: /dog_livo/path_high_rate
  path_corrected: /dog_livo/path_corrected
  filtered_points: /dog_livo/filtered_points
  diagnostics: /dog_livo/diagnostics
  ndt_odom: /dog_livo/ndt_odom
  ndt_pose: /dog_livo/ndt_pose
  ndt_path: /dog_livo/ndt_path
  points_aligned: /newer_college/points_aligned
map:
  pcd_fallback_path: /media/jian/HIKVISION/paper rosbag/NewerCollege/.p41_first_ndt/prior_map_xyz_binary.pcd
  voxel_size: 0.15
  voxel_z_size: 0.15
imu:
  gravity: 9.80665
  initialize_gravity_from_imu: false
  initialize_gyro_bias_from_imu: false
  midpoint_interval_input_enable: true
  init_imu_samples: 200
  max_dt: 0.05
  publish_high_rate: true
  publish_imu_propagate_alias: true
  use_acc_for_position: true
  velocity_damping: 0.98
  acc_noise: 2.0
  gyro_noise: 0.1
  acc_bias_noise: 0.0001
  gyro_bias_noise: 0.0001
  history_keep_sec: 2.0
ndt_observation:
  enable: true
  oosm_enable: true
  oosm_max_alignment_sec: 0.02
  apply_ratio: 1.0
  z_apply_ratio: 1.0
  roll_pitch_apply_ratio: 1.0
  max_translation_correction: 2.0
  max_rotation_correction_deg: 20.0
  velocity_blend: 0.6
  future_deferral_enable: false
  oosm_fixed_lag_enable: false
lidar_update:
  deskew_enable: false
  offset_time_scale: 1.0e-09
  ndt_source_voxel_size: 0.25
  ndt_source_voxel_z_size: 0.25
  ndt_target_voxel_size: 0.15
  ndt_target_voxel_z_size: 0.15
  ndt_max_source_points: 1400
  ndt_max_target_points: 0
  ndt_max_iterations: 40
  ndt_resolution: 0.8
  ndt_step_size: 0.08
  ndt_transformation_epsilon: 0.001
  ndt_step_limit_enable: true
  ndt_step_limit_max_translation: 0.5
  ndt_step_limit_max_rotation_deg: 5.0
  local_imu_rotation_prior_enable: true
  local_imu_gyro_to_lidar_enable: true
  T_imu_lidar_rotation_row_major:
  - 0.002944721319922164
  - 0.09880843134924956
  - -0.9951021166245445
  - -0.9999950072544592
  - -0.0008497652910321506
  - -0.00304357768162857
  - -0.0011463343761514682
  - 0.9951061108209771
  - 0.09880543570192515
  scan_reference_time: start
  pending_lidar_max_frames: 50
  lidar_subscriber_queue_size: 100
filter:
  init_pos_std: 0.5
  init_rot_std_deg: 5.0
  init_vel_std: 0.5
  init_bias_std: 0.05
  experimental_covariance_stability_enable: false
  experimental_square_root_covariance_enable: false
deskew:
  mode: ekf_imu_fastlio
  input_topic: /newer_college/raw_points
  output_topic: /newer_college/deskewed_points
  point_time_field: time
  expected_lidar_frame: benchmark_lidar
  reference_time: start
  state_frame: imu
  max_scan_duration_sec: 0.15
  max_imu_gap_sec: 0.02
  history_keep_sec: 2.0
  max_pending_clouds: 8
  input_subscriber_queue_size: 100
  T_imu_lidar_translation_m:
  - -0.05115427583720853
  - 0.0028481616211644494
  - 0.001062091780642729
  T_imu_lidar_rotation_row_major:
  - 0.002944721319922164
  - 0.09880843134924956
  - -0.9951021166245445
  - -0.9999950072544592
  - -0.0008497652910321506
  - -0.00304357768162857
  - -0.0011463343761514682
  - 0.9951061108209771
  - 0.09880543570192515
  experimental_scan_local_imu_enable: false
  experimental_history_nominal_consistent_enable: false
output:
  publish_tf: true
  ndt_publish_tf: false
  publish_path: true
  publish_filtered_points: true
  publish_diagnostics: true
  print_debug: true
  path_max_length: 5000
  path_sample_rate_hz: 2.0
  path_publish_rate_hz: 1.0
mature_integration:
  enable: false
mature_visual:
  enable: false
  time_adapter_enable: false
