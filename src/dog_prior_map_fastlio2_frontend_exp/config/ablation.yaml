schema_version: 1

# All profiles dispatch to the same p6_i1_branched_recovery closed-loop core.
# FULL is an offline research prototype: historical cross-covariance is
# conservatively bounded, not propagated as an augmented-state covariance.
execution_modes:
  formal_full_default: FORMAL_FULL_LEGACY
  fixed_lag_experimental: FULL_FIXED_LAG_EXPERIMENTAL
  default_enabled: FORMAL_FULL_LEGACY
module_availability:
  u_obs: true
  u_obs_method: "regularized NDT voxel geometric Gauss-Newton information proxy"
  u_nonlocal: true
  vision: true
  vision_core_integrated: true
  vision_method: "causal LiDAR-depth metric relative translation; PnP rotation discarded"
  vision_history_covariance: "conservative decorrelation bound; exact historical cross covariance unavailable"

profiles:
  B0:
    label: STRICT
    enable_u_obs: false
    enable_u_nonlocal: false
    enable_vision: false
    runner_mode: STRICT_BASELINE
    availability: AVAILABLE
  B1:
    label: STRICT_PLUS_U_OBS
    enable_u_obs: true
    enable_u_nonlocal: false
    enable_vision: false
    runner_mode: UOBS_ONLY
    availability: AVAILABLE
  B2:
    label: STRICT_PLUS_U_NONLOCAL
    enable_u_obs: false
    enable_u_nonlocal: true
    enable_vision: false
    runner_mode: UNONLOCAL_ONLY
    availability: AVAILABLE
  B3:
    label: STRICT_PLUS_U_OBS_PLUS_U_NONLOCAL
    enable_u_obs: true
    enable_u_nonlocal: true
    enable_vision: false
    runner_mode: DUAL_RELIABILITY
    availability: AVAILABLE
  B4:
    label: FULL_WITH_REAL_VISION
    enable_u_obs: true
    enable_u_nonlocal: true
    enable_vision: true
    runner_mode: FULL_ALGORITHM_V1
    availability: AVAILABLE_WITH_RESEARCH_PROTOTYPE_CAVEAT

experimental_modes:
  FULL_FIXED_LAG_EXPERIMENTAL:
    based_on: B4
    runner_mode: FULL_FIXED_LAG_EXPERIMENTAL
    formal_full_default_unchanged: true
    complete_rosbag_allowed_in_this_phase: false
    status: MATHEMATICAL_AND_SYNTHETIC_TEST_ONLY

dataset_maps:
  Floor01:
    map_sha256: 2b571af236738a0664befacdc9c783246e991416a8915bcfebb9d2dc074e4570
    map_profile: floor01
